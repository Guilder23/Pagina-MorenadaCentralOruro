<div class="modal fade modal-mc modal-peligro" id="modalEliminarBloque" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <form class="modal-content" id="formEliminarBloque" method="post" action="">
            {% csrf_token %}
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-trash"></i> Eliminar bloque</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body confirmacion">
                <p class="mb-1">Esta acción no se puede deshacer. ¿Eliminar el bloque?</p>
                <p class="confirmacion-nombre" id="eliminarBloqueNombre"></p>
                <small class="text-muted">Solo se pueden eliminar bloques sin danzarines asignados.</small>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Eliminar</button>
            </div>
        </form>
    </div>
</div>
