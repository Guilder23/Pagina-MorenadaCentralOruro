<div class="modal fade modal-mc modal-aviso" id="modalBloquearBloque" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <form class="modal-content" id="formBloquearBloque" method="post" action="">
            {% csrf_token %}
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-lock" id="bloquearBloqueIcono"></i> <span id="bloquearBloqueTitulo">Inhabilitar bloque</span></h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body confirmacion">
                <p class="mb-1" id="bloquearBloqueMensaje">¿Deseas cambiar el estado de este bloque?</p>
                <p class="confirmacion-nombre" id="bloquearBloqueNombre"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-warning" id="bloquearBloqueConfirmar">Confirmar</button>
            </div>
        </form>
    </div>
</div>
