<div class="modal fade modal-mc" id="modalEditarBloque" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <form class="modal-content" id="formEditarBloque" method="post" action="" autocomplete="off">
            {% csrf_token %}
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-edit"></i> Editar bloque</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="editNombreBloque">Nombre *</label>
                    <input type="text" class="form-control campo-mayus" id="editNombreBloque" name="nombre" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label for="editDescripcionBloque">Descripción</label>
                    <input type="text" class="form-control" id="editDescripcionBloque" name="descripcion" maxlength="255">
                </div>
                <div class="estado-switch">
                    <div class="custom-control custom-switch">
                        <input type="checkbox" class="custom-control-input" id="editHabilitadoBloque" name="habilitado">
                        <label class="custom-control-label" for="editHabilitadoBloque">Bloque habilitado</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar cambios</button>
            </div>
        </form>
    </div>
</div>
