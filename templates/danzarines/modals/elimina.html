<div class="modal fade modal-mc modal-aviso" id="modalBloquearDanzarin" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <form class="modal-content" id="formBloquearDanzarin" method="post" action="">
            {% csrf_token %}
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-lock" id="bloquearIcono"></i> <span id="bloquearTitulo">Inhabilitar danzarin</span></h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body confirmacion">
                <p class="mb-1" id="bloquearMensaje">¿Deseas cambiar el estado de este danzarin?</p>
                <p class="confirmacion-nombre" id="bloquearNombre"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-warning" id="bloquearConfirmar">Confirmar</button>
            </div>
        </form>
    </div>
</div>
